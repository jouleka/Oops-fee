<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Pure Black -->
  <rect width="1024" height="1024" fill="#000000"/>
  
  <g transform="translate(512, 540)" stroke="white" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- The Banana Peel (Universal symbol for a slip-up) -->
    
    <!-- The Stem (Distinctive woody part) -->
    <path d="M-20 -280 L20 -280 L10 -200 L-10 -200 Z" fill="white" stroke="none"/>
    
    <!-- Left Peel Flap -->
    <!-- Curves out and down, tip curling slightly up -->
    <path d="M-10 -200 Q-150 -150 -300 0 Q-350 50 -320 120" stroke-width="60"/>
    
    <!-- Right Peel Flap -->
    <path d="M10 -200 Q150 -150 300 0 Q350 50 320 120" stroke-width="60"/>
    
    <!-- Center/Front Peel Flap (Draped forward) -->
    <path d="M0 -200 Q0 0 20 250" stroke-width="60"/>
    
    <!-- Back Peel Flap (Visible behind) -->
    <path d="M0 -200 Q40 -250 80 -350" stroke-width="40" opacity="0.8"/>

    <!-- Motion/Slip Lines (To emphasize the 'action' of slipping) -->
    <g opacity="0.8">
      <path d="M-350 250 L-250 250" stroke-width="30"/>
      <path d="M-380 200 L-320 200" stroke-width="30"/>
    </g>

  </g>
</svg>