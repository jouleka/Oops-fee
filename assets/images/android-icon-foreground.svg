<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Android adaptive icon foreground - NO background, content in 66% safe zone -->
  
  <!-- Group centered and scaled to fit safe zone (66% = ~676px, with padding use ~60%) -->
  <g transform="translate(512, 512) scale(0.55) translate(-256, -256)">
    <!-- "oops" text -->
    <text x="256" y="300" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="180" 
          font-weight="900" 
          fill="#BFFF00" 
          text-anchor="middle" 
          letter-spacing="-8">
      oops
    </text>
    
    <!-- Smiley face - horizontal parenthesis (rotated) -->
    <text x="256" y="400" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="100" 
          font-weight="700" 
          fill="#BFFF00" 
          text-anchor="middle"
          transform="rotate(90 256 400)">
      )
    </text>
  </g>
</svg>
