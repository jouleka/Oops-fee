# Supabase Local Development Configuration
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "com.oopsfee.app://"
additional_redirect_urls = ["com.oopsfee.app://", "https://oopsfee.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Note: Enable leaked password protection (HIBP) in Supabase Dashboard:
# Authentication → Settings → Enable leaked password protection

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "com.oopsfee.app://"

[realtime]
enabled = true
ip_version = "IPv4"

[analytics]
enabled = false

# Public share/claim endpoints authenticate with high-entropy URL tokens.
[functions.submit-sponsor]
verify_jwt = false

[functions.submit-roast]
verify_jwt = false

[functions.submit-partner-decision]
verify_jwt = false

[functions.get-share-context]
verify_jwt = false

[functions.get-claim-context]
verify_jwt = false

[functions.claim-payout-to-card]
verify_jwt = false

[functions.paypal-payout]
verify_jwt = false

# Provider webhooks verify the provider signature in the handler.
[functions.stripe-webhook]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false

# Scheduled functions require their configured cron Bearer secret and fail closed.
[functions.settle-promises]
verify_jwt = false

[functions.expire-claims]
verify_jwt = false

[functions.refresh-leaderboard-stats]
verify_jwt = false

[functions.send-reengagement]
verify_jwt = false

[functions.send-social-proof]
verify_jwt = false

[functions.send-behavioral-insights]
verify_jwt = false

[functions.send-leaderboard-digest]
verify_jwt = false
